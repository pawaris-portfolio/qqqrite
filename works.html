<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Featured Works | Pawaris Chanchoo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f5f7;
      --surface: #ffffff;
      --surface-border: rgba(0, 0, 0, 0.06);
      --accent: #0066cc;
      --text: #1d1d1f;
      --text-muted: #86868b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg); color: var(--text); font-family: 'Sarabun', sans-serif; line-height: 1.7; padding: 0 1.5rem 5rem; }
    .container { max-width: 1040px; margin: 0 auto; }
    
    /* Navigation Bar */
    nav { 
      display: flex; justify-content: space-between; align-items: center; 
      padding: 2.2rem 0; border-bottom: 1px solid var(--surface-border); 
      margin-bottom: 3.5rem; position: relative; 
    }
    .logo { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 1.3rem; color: var(--text); text-decoration: none; letter-spacing: -0.5px; }
    .nav-links { display: flex; gap: 1.35rem; align-items: center; }
    .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 0.95rem; font-weight: 600; transition: color 0.2s; }
    .nav-links a.active, .nav-links a:hover { color: var(--text); }

    /* Mobile Hamburger Button */
    .menu-toggle {
      display: none; background: none; border: none; cursor: pointer; padding: 0.5rem;
      flex-direction: column; gap: 6px;
    }
    .menu-toggle span {
      display: block; width: 22px; height: 2px; background-color: var(--text);
      transition: all 0.3s ease; border-radius: 2px;
    }

    /* Typography */
    h1, h2, h3, strong { color: var(--text) !important; letter-spacing: -0.5px; }
    h1 { font-size: clamp(2rem, 4.5vw, 3rem); font-weight: 800; line-height: 1.15; margin-bottom: 1rem; }
    .page-desc { color: var(--text-muted); margin-bottom: 2rem; font-size: 1.15rem; }
    
    /* PDF Banner */
    .pdf-banner {
      margin-bottom: 3rem; display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap;
      background: var(--surface); padding: 1.5rem 2rem; border-radius: 20px; 
      border: 1px solid var(--surface-border); box-shadow: 0 4px 16px rgba(0,0,0,0.03);
    }

    /* Cards Grid */
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 2rem; }
    .work-card { 
      background: var(--surface); border: 1px solid var(--surface-border); 
      border-radius: 20px; padding: 2rem; box-shadow: 0 4px 24px rgba(0,0,0,0.03); 
      display: flex; flex-direction: column; justify-content: space-between; 
      transition: box-shadow 0.3s ease;
    }
    .work-card:hover { box-shadow: 0 12px 32px rgba(0,0,0,0.08); }
    
    .metric-chip { background: rgba(0, 102, 204, 0.08); color: var(--accent); border: none; padding: 0.4rem 1rem; border-radius: 980px; font-weight: 700; font-size: 0.85rem; display: inline-block; margin-bottom: 1rem; letter-spacing: 0.5px; }
    .work-card h3 { font-size: 1.25rem; margin-bottom: 0.5rem; line-height: 1.3; }
    .work-card p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1.5rem; }
    
    /* Smart Video Facade */
    .video-wrapper { 
      margin-top: auto; border-radius: 12px; overflow: hidden; 
      height: 600px; position: relative; border: 1px solid var(--surface-border);
      background: #ffffff; display: flex; justify-content: center;
    }
    
    .facade {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(145deg, #1d1d1f, #2c2c2e);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      cursor: pointer; transition: background 0.3s ease; color: #ffffff; z-index: 10;
    }
    .facade:hover { background: linear-gradient(145deg, #2c2c2e, #3a3a3c); }
    
    .play-btn {
      width: 64px; height: 64px; background: rgba(255,255,255,0.15); 
      border-radius: 50%; display: flex; justify-content: center; align-items: center; 
      backdrop-filter: blur(8px); margin-bottom: 1rem; border: 1px solid rgba(255,255,255,0.2);
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .play-btn::after { content: "▶"; font-size: 1.5rem; color: #fff; margin-left: 4px; }
    .facade:hover .play-btn { transform: scale(1.1); background: rgba(255,255,255,0.25); }
    .facade-text { font-size: 0.95rem; font-weight: 600; letter-spacing: 0.5px; opacity: 0.8; }
    
    blockquote.tiktok-embed { margin: 0 !important; padding: 0 !important; width: 100% !important; max-width: 100% !important; min-width: 100% !important; }

    /* Action Buttons */
    .video-action { margin-top: 1.25rem; display: flex; justify-content: center; }
    .btn-external { 
      background: var(--bg); color: var(--text); border: 1px solid var(--surface-border); 
      padding: 0.65rem 1.25rem; border-radius: 980px; text-decoration: none; 
      font-weight: 600; font-size: 0.9rem; transition: all 0.2s ease; display: inline-block;
    }
    .btn-external:hover { background: #e5e5ea; transform: scale(1.02); }

    /* Bottom Page Navigation */
    .page-nav {
      margin-top: 4.5rem;
      padding-top: 2.5rem;
      border-top: 1px solid var(--surface-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1.25rem;
      flex-wrap: wrap;
    }
    .nav-card {
      display: flex;
      flex-direction: column;
      text-decoration: none;
      padding: 1.2rem 1.8rem;
      border-radius: 16px;
      border: 1px solid var(--surface-border);
      background: var(--surface);
      box-shadow: 0 4px 16px rgba(0,0,0,0.02);
      transition: all 0.2s ease;
      min-width: 220px;
    }
    .nav-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    }
    .nav-card.prev { text-align: left; }
    .nav-card.next {
      margin-left: auto;
      text-align: right;
      background: var(--text);
      color: var(--bg) !important;
      border-color: var(--text);
    }
    .nav-card.next .nav-sub { color: rgba(255, 255, 255, 0.7); }
    .nav-card.next .nav-title { color: #ffffff !important; }
    .nav-sub {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }
    .nav-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
    }

    /* Responsive */
    @media (max-width: 860px) {
      body { padding: 0 1.25rem 3.5rem; }
      nav { padding: 1.5rem 0; margin-bottom: 2rem; }
      .menu-toggle { display: flex; }

      .nav-links {
        display: none; position: absolute; top: 100%; left: 0; width: 100%;
        background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(20px);
        border: 1px solid var(--surface-border); border-radius: 18px;
        flex-direction: column; padding: 1.25rem; gap: 0.75rem;
        box-shadow: 0 16px 32px rgba(0,0,0,0.08); z-index: 100;
      }
      .nav-links.open { display: flex; }
      .nav-links a { width: 100%; padding: 0.6rem 0.75rem; font-size: 1rem; border-radius: 8px; border-bottom: 1px solid rgba(0,0,0,0.03); }
      .nav-links a.active { background: rgba(0, 102, 204, 0.08); color: var(--accent); }

      .menu-toggle.active span:nth-child(1) { transform: translateY(4px) rotate(45deg); }
      .menu-toggle.active span:nth-child(2) { transform: translateY(-4px) rotate(-45deg); }

      h1 { font-size: 1.85rem; }
      .page-desc { font-size: 1rem; margin-bottom: 1.75rem; }

      .pdf-banner { padding: 1.25rem; gap: 1rem; border-radius: 16px; }
      .pdf-banner .btn-external { width: 100%; text-align: center; padding: 0.75rem 1rem; }

      .grid { grid-template-columns: 1fr; gap: 1.5rem; }
      .work-card { padding: 1.25rem; border-radius: 16px; }
      .video-action .btn-external { width: 100%; text-align: center; padding: 0.75rem 1rem; }
      .video-wrapper { height: 550px; }

      .page-nav {
        flex-direction: column;
        gap: 0.85rem;
        margin-top: 3.5rem;
        padding-top: 1.75rem;
      }
      .nav-card {
        width: 100%;
        text-align: center !important;
        padding: 1.1rem 1.25rem;
      }
      .nav-card.next { margin-left: 0; }
    }
  </style>
</head>
