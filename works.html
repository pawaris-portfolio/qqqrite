<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAP+ PWC Marketing Team · AI Agent Structure & Ad Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0f1b3d;--muted:#5a6480;--line:#d9dfec;--bg:#f5f5f7;--card:#fff;
  --navy:#1a3a8f;--lead:#ece9fe;--lead-b:#6b5fd6;--sub:#e3f5ee;--sub-b:#1d9e75;--gray:#f1f2f5;
  --surface-border: rgba(0, 0, 0, 0.06); --text: #1d1d1f; --text-muted: #86868b; --accent: #0066cc;
}
*{box-sizing:border-box}
body{margin:0;font-family:"IBM Plex Sans Thai",system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.65;padding:0 1.5rem 5rem}

.nav-container{max-width:1040px;margin:0 auto}
nav{
  display:flex;justify-content:space-between;align-items:center;
  padding:2.2rem 0;border-bottom:1px solid var(--surface-border);
  margin-bottom:2.5rem;position:relative;font-family:'Sarabun',sans-serif;
}
.logo{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:1.3rem;color:var(--text);text-decoration:none;letter-spacing:-0.5px}
.nav-links{display:flex;gap:1.35rem;align-items:center;flex-wrap:wrap}
.nav-links a{color:var(--text-muted);text-decoration:none;font-size:0.95rem;font-weight:600;transition:color 0.2s}
.nav-links a.active,.nav-links a:hover{color:var(--text)}
.menu-toggle{display:none;background:none;border:none;cursor:pointer;padding:0.5rem;flex-direction:column;gap:6px}
.menu-toggle span{display:block;width:22px;height:2px;background-color:var(--text);transition:all 0.3s ease;border-radius:2px}

header{background:var(--navy);color:#fff;padding:40px 24px 32px;text-align:center;border-radius:20px;max-width:1040px;margin:0 auto}
header h1{margin:0 0 6px;font-size:28px;font-weight:600}
header p{margin:0;opacity:.85}
main{max-width:1040px;margin:0 auto;padding:28px 0 40px}
section{margin-bottom:44px}
h2{font-size:21px;font-weight:600;margin:0 0 14px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card b{display:block;margin-bottom:4px}
.small{font-size:14px;color:var(--muted)}
.org{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
.row{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;align-items:stretch}
.node{border-radius:12px;padding:12px 14px;text-align:center;cursor:pointer;transition:transform .15s,box-shadow .15s;border:1.5px solid transparent;min-width:170px}
.node:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(15,27,61,.1)}
.node.active{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--navy)}
.node .t{font-weight:600}
.node .s{font-size:13px;opacity:.8}
.node .n{font-size:12px;margin-top:2px;opacity:.7}
.lead{background:var(--lead);border-color:var(--lead-b);color:#2b2470;min-width:280px}
.sub{background:var(--sub);border-color:var(--sub-b);color:#08503f;flex:1;max-width:220px}
.human{background:var(--gray);border-color:#b9bdc8;color:#2c2f38}
.connector{text-align:center;color:var(--muted);font-size:13px;margin:8px 0}
.arrow{display:flex;align-items:center;color:var(--muted);font-size:12px;flex-direction:column;justify-content:center}
.pipe{display:flex;gap:8px;align-items:stretch;justify-content:center;flex-wrap:wrap}
.loop{text-align:center;color:var(--muted);font-size:14px;margin-top:14px}
#detail{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;margin-top:18px}
#detail h3{margin:0;font-size:22px}
#detail .role{color:var(--muted);margin-bottom:14px}
.spec{display:grid;grid-template-columns:140px 1fr;gap:6px 14px;background:#f6f8fc;border-radius:10px;padding:14px;font-size:14px;margin-bottom:16px}
.spec div:nth-child(odd){color:var(--muted)}
code{background:#eef1f8;border-radius:4px;padding:1px 6px;font-size:13px}
.sop{border-left:3px solid var(--sub-b);padding:4px 0 4px 14px;margin:12px 0}
.sop h4{margin:0 0 4px;font-size:16px}
ul,ol{margin:4px 0;padding-left:22px}
.tag{display:inline-block;background:#eef1f8;border-radius:20px;padding:2px 10px;font-size:13px;margin:2px 4px 2px 0}
.check li{list-style:none;margin-left:-22px}
.check li::before{content:"☐ ";color:var(--sub-b)}
h5{font-size:15px;margin:18px 0 6px}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;font-size:14px;border:1px solid var(--line)}
th,td{border-bottom:1px solid var(--line);padding:10px 12px;text-align:left}
th{background:#eef1f8;font-weight:600}
footer{text-align:center;color:var(--muted);font-size:13px;padding:20px}

/* --- Custom Styles สำหรับส่วนที่ 6: Paid Ads Performance --- */
.ads-divider{border:none;border-top:1px solid var(--line);margin:44px 0 36px}
.kpi-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;justify-content:space-between}
.kpi-label{font-size:13px;color:var(--muted);font-weight:500;margin-bottom:6px}
.kpi-val{font-family:'Plus Jakarta Sans',"IBM Plex Sans Thai",sans-serif;font-size:26px;font-weight:800;color:var(--ink);line-height:1.2}
.kpi-val.green{color:#0f7b5b}
.kpi-val.navy{color:var(--navy)}
.badge-up{display:inline-block;background:#e3f5ee;color:#08503f;border:1px solid #b5e4d2;font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px;vertical-align:middle;margin-left:4px}
.kpi-sub{font-size:12.5px;color:var(--muted);margin-top:6px}
