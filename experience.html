<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experience & Activities | Pawaris Chanchoo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f5f7;
      --surface: #ffffff;
      --surface-border: rgba(0, 0, 0, 0.06);
      --accent: #0066cc;
      --text: #1d1d1f;
      --text-muted: #86868b;
      --highlight: #0066cc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg); color: var(--text); font-family: 'Sarabun', sans-serif; line-height: 1.7; padding: 0 1.5rem 5rem; }
    .container { max-width: 900px; margin: 0 auto; }
    
    /* Navigation Bar */
    nav { 
      display: flex; justify-content: space-between; align-items: center; 
      padding: 2.2rem 0; border-bottom: 1px solid var(--surface-border); 
      margin-bottom: 3.5rem; position: relative; 
    }
    .logo { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 1.3rem; color: var(--text); text-decoration: none; letter-spacing: -0.5px; }
    .nav-links { display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap; }
    .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 0.95rem; font-weight: 600; transition: color 0.2s; }
    .nav-links a.active, .nav-links a:hover { color: var(--text); }

    /* Mobile Hamburger Button */
    .menu-toggle {
      display: none; background: none; border: none; cursor: pointer; padding: 0.5rem;
      flex-direction: column; gap: 6px;
    }
    .menu-toggle span {
      display: block; width: 22px; height: 2px; background-color: var(--text);
      transition: all 0.3s ease; border-radius: 2px;
    }

    /* Typography */
    h1, h2, h3, strong { color: var(--text) !important; letter-spacing: -0.5px; }
    h1 { font-size: clamp(2rem, 4.5vw, 3rem); font-weight: 800; line-height: 1.15; margin-bottom: 1rem; }
    h2 { font-size: 1.75rem; margin: 3.5rem 0 1.5rem; font-weight: 700; }
    .page-desc { color: var(--text-muted); margin-bottom: 3rem; font-size: 1.15rem; }

    /* Experience Cards */
    .exp-card { 
      background: var(--surface); border: 1px solid var(--surface-border); 
      border-radius: 20px; padding: 2.5rem; margin-bottom: 1.75rem; 
      box-shadow: 0 4px 24px rgba(0,0,0,0.03); transition: box-shadow 0.3s ease;
    }
    .exp-card:hover { box-shadow: 0 12px 32px rgba(0,0,0,0.08); }
    
    .exp-header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; margin-bottom: 1rem; gap: 1rem; }
    .exp-title { font-size: 1.35rem; font-weight: 700; margin-bottom: 0.2rem; }
    .exp-company { font-size: 1.05rem; color: var(--accent); font-weight: 600; }
    .exp-period { font-size: 0.85rem; color: var(--accent); background: rgba(0, 102, 204, 0.08); padding: 0.35rem 0.85rem; border-radius: 980px; font-weight: 600; display: inline-block; }
    
    .exp-list { list-style: none; margin-top: 1.25rem; font-size: 1rem; color: var(--text-muted); }
    .exp-list li { margin-bottom: 0.6rem; padding-left: 1.25rem; position: relative; }
    .exp-list li::before { content: "•"; color: var(--accent); position: absolute; left: 0; font-size: 1.2rem; line-height: 1.5; }
    
    /* Activities Grid */
    .act-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; }
    .act-card { 
      background: var(--surface); border: 1px solid var(--surface-border); 
      border-radius: 16px; padding: 1.75rem; box-shadow: 0 4px 16px rgba(0,0,0,0.02); 
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .act-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.06); }
    .act-card h3 { font-size: 1.15rem; margin-bottom: 0.5rem; }
    .act-card p { font-size: 0.95rem; color: var(--text-muted); margin: 0; }

    /* Bottom Page Navigation */
    .page-nav {
      margin-top: 4.5rem;
      padding-top: 2.5rem;
      border-top: 1px solid var(--surface-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1.25rem;
      flex-wrap: wrap;
    }
    .nav-card {
      display: flex;
      flex-direction: column;
      text-decoration: none;
      padding: 1.2rem 1.8rem;
      border-radius: 16px;
      border: 1px solid var(--surface-border);
      background: var(--surface);
      box-shadow: 0 4px 16px rgba(0,0,0,0.02);
      transition: all 0.2s ease;
      min-width: 220px;
    }
    .nav-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    }
    .nav-card.prev { text-align: left; }
    .nav-card.next {
      margin-left: auto;
      text-align: right;
      background: var(--text);
      color: var(--bg) !important;
      border-color: var(--text);
    }
    .nav-card.next .nav-sub { color: rgba(255, 255, 255, 0.7); }
    .nav-card.next .nav-title { color: #ffffff !important; }
    .nav-sub {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }
    .nav-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
    }

    /* Responsive */
    @media (max-width: 768px) {
      body { padding: 0 1.25rem 3.5rem; }
      nav { padding: 1.5rem 0; margin-bottom: 2rem; }
      .menu-toggle { display: flex; }

      .nav-links {
        display: none; position: absolute; top: 100%; left: 0; width: 100%;
        background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(20px);
        border: 1px solid var(--surface-border); border-radius: 18px;
        flex-direction: column; padding: 1.25rem; gap: 0.75rem;
        box-shadow: 0 16px 32px rgba(0,0,0,0.08); z-index: 100;
      }
      .nav-links.open { display: flex; }
      .nav-links a { width: 100%; padding: 0.6rem 0.75rem; font-size: 1rem; border-radius: 8px; border-bottom: 1px solid rgba(0,0,0,0.03); }
      .nav-links a.active { background: rgba(0, 102, 204, 0.08); color: var(--accent); }

      .menu-toggle.active span:nth-child(1) { transform: translateY(4px) rotate(45deg); }
      .menu-toggle.active span:nth-child(2) { transform: translateY(-4px) rotate(-45deg); }

      h1 { font-size: 1.85rem; }
      h2 { font-size: 1.45rem; margin: 2.5rem 0 1.25rem; }
      .page-desc { font-size: 1rem; margin-bottom: 2rem; }

      .exp-card { padding: 1.5rem 1.25rem; border-radius: 16px; }
      .exp-header { flex-direction: column; gap: 0.5rem; }
      .exp-title { font-size: 1.2rem; }
      .exp-company { font-size: 0.95rem; margin-bottom: 0.25rem; }
      .exp-list { font-size: 0.95rem; margin-top: 1rem; }

      .act-grid { grid-template-columns: 1fr; gap: 1rem; }
      .act-card { padding: 1.25rem; border-radius: 14px; }

      .page-nav {
        flex-direction: column;
        gap: 0.85rem;
        margin-top: 3.5rem;
        padding-top: 1.75rem;
      }
      .nav-card {
        width: 100%;
        text-align: center !important;
        padding: 1.1rem 1.25rem;
      }
      .nav-card.next { margin-left: 0; }
    }
  </style>
</head>
